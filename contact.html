<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연락처 - 나의 포트폴리오</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <span class="nav-brand">MY PORTFOLIO</span>
    <ul class="nav-menu">
      <li><a href="index.html">소개</a></li>
      <li><a href="works.html">작업물</a></li>
      <li><a href="contact.html" class="active">연락처</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2 class="section-title">연락처</h2>

  <ul class="contact-info">
    <li><strong>이메일</strong> hong@example.com</li>
    <li><strong>GitHub</strong> github.com/honggildong</li>
  </ul>

  <form class="contact-form">
    <div>
      <label for="name">이름</label>
      <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
    </div>
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" placeholder="답장받을 이메일을 입력하세요">
    </div>
    <div>
      <label for="message">메시지</label>
      <textarea id="message" name="message" placeholder="전하고 싶은 메시지를 입력하세요"></textarea>
    </div>
    <button type="submit">메시지 보내기</button>
  </form>
</main>

<footer class="site-footer">
  <p>&copy; 2026 홍길동. All rights reserved.</p>
</footer>
